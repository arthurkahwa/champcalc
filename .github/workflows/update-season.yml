name: Update season data

on:
  schedule:
    # Every 15 min on Fri/Sat/Sun (covers practice, quali, sprint, race weekends)
    - cron: '*/15 * * * 5,6,0'
    # Once a day the rest of the week, in case of anything unusual
    - cron: '0 6 * * 1,2,3,4'
  workflow_dispatch: {}   # manual override, always available if something needs a nudge

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch results and recompute season data
        id: update
        env:
          SEASON_YEAR: '2026'
        run: python scripts/update_season.py

      - name: Commit updated season JSON
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "f1-app-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/season-${SEASON_YEAR:-2026}.json
          git commit -m "Update season data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
        env:
          SEASON_YEAR: '2026'

      - name: Trigger push notifications
        if: steps.update.outputs.notify == 'true'
        env:
          PUSH_FUNCTION_URL: ${{ secrets.PUSH_FUNCTION_URL }}
          PUSH_FUNCTION_TOKEN: ${{ secrets.PUSH_FUNCTION_TOKEN }}
        run: python scripts/notify.py
